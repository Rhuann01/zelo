<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#FAF9F6" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#0F0F12" media="(prefers-color-scheme: dark)" />
  <title>Sem conexão — Zelo</title>
  <style>
    :root {
      --bg: #FAF9F6;
      --surface: #F2F0EB;
      --text: #141416;
      --muted: #5C5C66;
      --accent: #141416;
      --accent-fg: #FAF9F6;
      --icon-bg: #E8E5DE;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0F0F12;
        --surface: #18181D;
        --text: #FAF9F6;
        --muted: #A1A1AA;
        --accent: #FAF9F6;
        --accent-fg: #0F0F12;
        --icon-bg: #23232A;
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px calc(24px + env(safe-area-inset-bottom, 0px));
      -webkit-font-smoothing: antialiased;
    }

    .card {
      width: 100%;
      max-width: 380px;
      background-color: var(--surface);
      border-radius: 20px;
      padding: 32px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
      opacity: 0.9;
    }

    .icon-wrap {
      width: 56px;
      height: 56px;
      border-radius: 16px;
      background-color: var(--icon-bg);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text);
    }

    .copy {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    h1 {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.25;
    }

    p {
      font-size: 14px;
      line-height: 1.5;
      color: var(--muted);
    }

    button {
      width: 100%;
      min-height: 46px;
      border: none;
      border-radius: 12px;
      background-color: var(--accent);
      color: var(--accent-fg);
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: opacity 0.15s ease, transform 0.1s ease;
    }

    button:active {
      transform: scale(0.98);
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <main class="card" role="main">
    <div class="brand" aria-label="Zelo">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect width="24" height="24" rx="6" fill="currentColor" />
        <path d="M7.5 8H16.5L7.5 16H16.5" stroke="var(--accent-fg)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
      <span>Zelo</span>
    </div>

    <div class="icon-wrap" aria-hidden="true">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01" />
        <path d="M8.5 16.429a5 5 0 0 1 7 0" />
        <path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
        <path d="M19 12.859a10 10 0 0 0-2.007-1.523" />
        <path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
        <path d="M22 8.82a15 15 0 0 0-11.288-3.764" />
        <path d="m2 2 20 20" />
      </svg>
    </div>

    <div class="copy">
      <h1>Você está sem conexão</h1>
      <p>Verifique sua internet e tente novamente para acessar sua agenda e agendamentos.</p>
    </div>

    <button type="button" onclick="window.location.reload()">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
        <path d="M8 16H3v5" />
      </svg>
      <span>Tentar novamente</span>
    </button>
  </main>
</body>
</html>
